name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directory where the Terraform modules live.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/generate_terraform_docs.yaml'
  push:
    branches:
      - 5/main
    paths:
      - 'terraform/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@0c8c3b8ab7c826146cb058bd73b62887e3b31944  # main
    secrets: inherit
    with:
      terraform-directory: terraform
