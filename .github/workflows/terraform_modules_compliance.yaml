name: Terraform modules compliance

on:
  pull_request:
    paths:
      - '**/terraform/**'

permissions:
  contents: read

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@main  # main
    with:
      terraform-directories: '["terraform"]'
