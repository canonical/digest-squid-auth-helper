name: Terraform modules release

on:
  workflow_dispatch:
  push:
    branches:
      - 5/main
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'

jobs:
  terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    permissions:
      contents: write
