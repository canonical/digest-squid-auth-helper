name: Terraform modules release

on:
  workflow_dispatch:
  push:
    branches:
      - 5/main
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'

jobs:
  terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@0ad5fa95ddbd34f7fa6a70f552269a4090f35fa3  # main
    permissions:
      contents: write
