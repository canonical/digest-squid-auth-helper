name: Terraform modules release

on:
  workflow_dispatch:
  push:
    branches:
      - 5/main
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'

jobs:
  terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@948386e20781573f08d9ccab0b9b09a772aa29f1  # main
    permissions:
      contents: write
