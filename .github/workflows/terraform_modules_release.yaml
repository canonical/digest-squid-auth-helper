name: Terraform modules release

on:
  workflow_dispatch:
  push:
    branches:
      - 5/main
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_release.yaml'

jobs:
  terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@4cd64727ffba2e8698659deec6d8b3c8453b79be  # main
    permissions:
      contents: write
